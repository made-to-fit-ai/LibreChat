name: Lint for accessibility issues

on:
  pull_request:
    paths:
      - 'client/src/**'
      - '!**.md'
  workflow_dispatch:
    inputs:
      run_workflow:
        description: 'Set to true to run this workflow'
        required: true
        default: 'false'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  axe-linter:
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_workflow == 'true')
    # A fork without the Deque key cannot run the linter; say so instead of failing every PR.
    env:
      AXE_LINTER_API_KEY: ${{ secrets.AXE_LINTER_API_KEY }}

    steps:
      - name: Skip without an API key
        if: env.AXE_LINTER_API_KEY == ''
        run: echo "::notice::AXE_LINTER_API_KEY is not set for this repository, so axe-linter did not run."
      - uses: actions/checkout@v5
        if: env.AXE_LINTER_API_KEY != ''
      # The action publishes v2.0.0 but no moving v2 tag, so @v2 cannot be resolved.
      - uses: dequelabs/axe-linter-action@v2.0.0
        if: env.AXE_LINTER_API_KEY != ''
        with:
          api_key: ${{ env.AXE_LINTER_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
